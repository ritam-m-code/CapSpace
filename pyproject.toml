[project]
name = "capspace"
version = "0.1.0"
description = "Arbitrage, daily schedule optimization, and multi-category trade evaluation for competitive NBA fantasy leagues."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ritam Mukherjee" }]

dependencies = [
    "nba_api>=1.4",
    "espn-api>=0.33",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "duckdb>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
capspace = "capspace.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["capspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Plan documents carry illustrative snippets, not shipped code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer's documented idiom is a call in the parameter default.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
include = ["capspace", "tests"]
